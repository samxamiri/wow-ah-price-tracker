# Kustomize (built into kubectl) bundles the manifests:  kubectl apply -k k8s
# The deploy workflow rewrites the image names below to point at ECR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wow-ah
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - worker-cronjob.yaml
  - ingress.yaml
images:
  - name: wow-ah-api
    newTag: latest
  - name: wow-ah-web
    newTag: latest
  - name: wow-ah-worker
    newTag: latest
