apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2 # two copies, so one can restart without downtime
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ecr-pull # created by the deploy workflow; ignored if it doesn't exist
      containers:
        - name: api
          image: wow-ah-api # replaced with the real ECR image by kustomization.yaml
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            # $(POSTGRES_PASSWORD) is filled in by Kubernetes from the variable above.
            - name: DATABASE_URL
              value: postgresql://wow:$(POSTGRES_PASSWORD)@postgres:5432/wow_ah
          # Readiness: only send traffic once the API can reach the database.
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
          # Liveness: restart the container if it stops responding.
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api # nginx in the web pod proxies /api/ to http://api:3000
spec:
  selector:
    app: api
  ports:
    - port: 3000
