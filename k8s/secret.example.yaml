# Copy to secret.yaml (git ignores it), fill in real values, then:
#   kubectl apply -f k8s/namespace.yaml -f k8s/secret.yaml
# Use a password with only letters and numbers, because it is placed inside a URL.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: wow-ah
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  BLIZZARD_CLIENT_ID: ""
  BLIZZARD_CLIENT_SECRET: ""
