# Routes outside HTTP traffic into the cluster. k3s includes the Traefik
# ingress controller by default, so this works on k3s with no extra setup.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wow-ah
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
