server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the Node service. "api" is the service name in
    # both docker-compose.yml and the Kubernetes manifests.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built JS/CSS files have a content hash in their name, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: send unknown paths (like /items/123) to index.html
    # and let React Router handle them.
    location / {
        try_files $uri /index.html;
    }
}
