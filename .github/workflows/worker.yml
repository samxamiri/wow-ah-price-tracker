# Runs the Python worker every hour on GitHub's servers, writing to the
# Neon database. This replaces the Kubernetes CronJob for the free deployment.
#
# Needs the repository secret DATABASE_URL (the Neon connection string).
# Also has a "Run workflow" button (workflow_dispatch) to run it by hand.
name: Worker

on:
  schedule:
    - cron: "17 * * * *" # minute 17 of every hour (UTC); GitHub is busiest at :00
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r requirements.txt
      - name: Take a snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MOCK_DATA: "true"
        run: python -m ah_worker.main
