# Runs the Python worker every hour on GitHub's servers, writing to the
# Neon database. This replaces the Kubernetes CronJob for the free deployment.
#
# Needs the repository secrets DATABASE_URL (the Neon connection string),
# BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET (from develop.battle.net).
# Also has a "Run workflow" button (workflow_dispatch) to run it by hand.
name: Worker

on:
  schedule:
    - cron: "17 * * * *" # minute 17 of every hour (UTC); GitHub is busiest at :00
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r requirements.txt
      - name: Take a snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MOCK_DATA: "false"
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLIZZARD_REGION: us
          # Each new item needs 2 API calls for its name and icon. 500 per run
          # names a few thousand items within a day or two.
          METADATA_BATCH_SIZE: "500"
          RETENTION_DAYS: "30"
        run: python -m ah_worker.main
